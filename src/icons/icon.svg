<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Cache even Longer">
  <title>Cache even Longer</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68d391"/>
      <stop offset="1" stop-color="#2f855a"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#background)"/>

  <!-- Clock face: the cache lifetime -->
  <circle cx="46" cy="46" r="26" fill="#ffffff"/>
  <path d="M46 31v15l10 6" fill="none" stroke="#1a365d" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plus badge: "longer" -->
  <circle cx="72" cy="72" r="15" fill="url(#badge)" stroke="#1a365d" stroke-width="4"/>
  <path d="M72 64v16M64 72h16" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
